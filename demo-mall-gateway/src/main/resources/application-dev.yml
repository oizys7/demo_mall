# Development环境配置
# SpringDoc OpenAPI 聚合配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    urls:
      - name: User Service API (Dev)
        url: http://localhost:9201/v3/api-docs
      - name: Product Service API (Dev)
        url: http://localhost:9202/v3/api-docs
      - name: Order Service API (Dev)
        url: http://localhost:9203/v3/api-docs
  info:
    title: Demo Mall Gateway API (Development)
    description: Demo Mall 网关聚合 API 文档 - 开发环境
    version: 1.0.0
    contact:
      name: Demo Mall Team
      email: support@demo-mall.com