# Development环境配置
# SpringDoc OpenAPI 聚合配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    urls:
      - name: User Service API (Dev)
        url: /v3/api-docs/demo-mall-user
      - name: Product Service API (Dev)
        url: /v3/api-docs/demo-mall-product
      - name: Order Service API (Dev)
        url: /v3/api-docs/demo-mall-order
  info:
    title: Demo Mall Gateway API (Development)
    description: Demo Mall 网关聚合 API 文档 - 开发环境
    version: 1.0.0
    contact:
      name: Demo Mall Team
      email: support@demo-mall.com