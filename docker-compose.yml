# Demo Mall 基础设施服务配置
# 包含 PostgreSQL、Redis、Elasticsearch、Kibana 等基础服务
# 用于支撑微服务架构的运行

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:latest
    container_name: demo-mall-postgres
    restart: always
    environment:
      POSTGRES_USER: oizys
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: demo_mall
      # 数据库配置优化
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - demo-mall-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oizys"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 缓存服务
  redis:
    image: redis:latest
    container_name: demo-mall-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - demo-mall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass demo-mall-redis
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Elasticsearch 搜索服务
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    container_name: demo-mall-elasticsearch
    restart: always
    environment:
      - node.name=es01
      - cluster.name=demo-mall-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m -XX:+UseG1GC"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      # 索引配置优化
      - "index.number_of_shards=1"
      - "index.number_of_replicas=0"
      - "index.refresh_interval=1s"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - demo-mall-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Kibana 用于 Elasticsearch 可视化管理
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.5
    container_name: demo-mall-kibana
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: false
      # Kibana 配置优化
      SERVER_NAME: "demo-mall-kibana"
      SERVER_HOST: "0.0.0.0"
    ports:
      - "5601:5601"
    networks:
      - demo-mall-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nacos 服务注册中心（可选，用于完整环境）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: demo-mall-nacos
    restart: always
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=embedded
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=256m
      # Nacos 配置优化
      - NACOS_APPLICATION_PORT=8848
      - NACOS_SERVER_PORT=8848
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - demo-mall-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  nacos_data:
    driver: local

networks:
  demo-mall-network:
    driver: bridge